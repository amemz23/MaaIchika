name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: pip install pillow

      - name: 结构自检（JSON / 引用 / 占位 / 盲点动作 / 环无出口 / i18n）
        run: python tools/check_json.py

      - name: 参数自检（ROI 越界 / 模板存在 / 阈值范围 / ColorMatch 通道）
        run: python tools/check_params.py

      - name: 真机踩坑审计（max_hit 偏小 / 回跳无上限 / 候选全 miss / 空 next）
        run: python tools/audit.py

      - name: 打包运行布局
        run: python tools/pack.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 格式检查
        run: npx prettier --check "**/*.{json,md,yml,yaml}"

      - name: MaaFramework 真实加载校验（interface + 资源包）
        run: node tools/check_interface.mjs

      - name: maa-tools 官方校验（可选，需要联网下载 MaaFramework）
        run: npx maa-tools check
        continue-on-error: true
