name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缁撴瀯鑷锛圝SON / 寮曠敤 / 鍗犱綅 / 鐜棤鍑哄彛 / i18n锛?        run: |
          pip install pillow
          python tools/check_json.py

      - name: 鎵撳寘杩愯甯冨眬
        run: python tools/pack.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 瀹夎渚濊禆
        run: npm install --no-audit --no-fund

      - name: 鏍煎紡妫€鏌?        run: npx prettier --check "**/*.{json,md,yml,yaml}"

      - name: MaaFramework 鐪熷疄鍔犺浇鏍￠獙锛坕nterface + 璧勬簮鍖咃級
        run: node tools/check_interface.mjs

      - name: maa-tools 瀹樻柟鏍￠獙锛堝彲閫夛紝闇€瑕佽仈缃戜笅杞?MaaFramework锛?        run: npx maa-tools check
        continue-on-error: true
