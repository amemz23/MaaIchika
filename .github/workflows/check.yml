name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 结构自检（JSON / 引用 / 占位 / 环无出口 / i18n）
        run: |
          pip install pillow
          python tools/check_json.py

      - name: 打包运行布局
        run: python tools/pack.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 格式检查
        run: npx prettier --check "**/*.{json,md,yml,yaml}"

      - name: MaaFramework 真实加载校验
        run: npx maa-tools check
